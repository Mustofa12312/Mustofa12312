
name: 🌌 Generate 3D Contribution Profile

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  generate:
    name: Build 3D Contribution Graph
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name: 🧊 Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Mustofa12312

      - name: 💾 Save Generated Graph
        run: |
          git add profile-3d-contrib/

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "chore: update 3D contribution graph"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No changes to the 3D graph."
          fi
